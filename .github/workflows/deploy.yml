name: Build & Deploy

# ============================================================
# OpsFlow CI/CD —— 云端构建 + 内网部署（混合架构）
#
# 为什么拆成两个 job：
#   1. 192.168.2.136 是 RFC1918 私有地址，GitHub 云端 runner 无法连入，
#      所以「部署」必须由 136 上的自托管 runner 执行。
#   2. 但 136 只有 2GB 内存、可用约 300MB，跑 Maven + vue-tsc 构建风险高，
#      所以「构建」放到 GitHub 托管 runner（本仓库为 public，免费且不限时长）。
#
# 为什么用 Release 资源而不是 upload-artifact（重要）：
#   实测 136 从 artifact 的 Azure Blob 存储下载仅约 47 KB/s，
#   117MB 的 jar 需约 41 分钟；而经 gh-proxy 镜像拉取 Release 资源约 10 MB/s。
#   因此构建产物通过 Release 分发，并由 scripts/fetch-release.sh 强制校验 sha256。
#
# ⚠️ 安全（重要）：
#   本仓库是 public，且部署 job 跑在自托管 runner 上。
#   绝不能添加 pull_request / pull_request_target 触发 —— 否则任何人的 fork PR
#   都能在 136 上执行任意代码。只允许 push(main) 与手动触发。
#   部署脚本刻意使用 root 拥有的固定路径 /opt/opsflow/bin/deploy.sh，
#   sudoers 只放行这一条命令，因此改动 scripts/deploy.sh 后需重新安装到该路径。
# ============================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: opsflow-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------- 阶段一：云端构建 ----------
  build:
    name: Build (cloud)
    runs-on: ubuntu-latest
    outputs:
      run_number: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend (Maven)
        run: |
          cd backend
          mvn -B clean package -DskipTests -q
          ls -lh target/*.jar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Vite)
        run: |
          cd frontend
          npm ci --no-audit --no-fund --loglevel=error
          npm run build
          ls -lh dist | head -5

      - name: 打包产物（前端打成 tar.gz，避免目录结构丢失）
        run: |
          mkdir -p /tmp/rel
          cp backend/target/opsflow-backend-*.jar /tmp/rel/opsflow-backend.jar
          tar -czf /tmp/rel/frontend-dist.tar.gz -C frontend/dist .
          ls -lh /tmp/rel

      - name: 发布到 Release（供 136 高速拉取）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${{ github.run_number }}"
          # 清理同名旧 release（重跑时）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            /tmp/rel/opsflow-backend.jar \
            /tmp/rel/frontend-dist.tar.gz \
            --title "CI build #${{ github.run_number }}" \
            --notes "自动构建产物：${{ github.sha }}" \
            --prerelease

  # ---------- 阶段二：在 136 自托管 runner 上部署 ----------
  deploy:
    name: Deploy (192.168.2.136)
    needs: build
    runs-on: [self-hosted, opsflow]
    steps:
      # 注意：此处刻意不用 actions/checkout。
      # 实测 136 上 `git clone https://github.com/...` 被拒（443 拒绝连接），
      # 而 actions/checkout 依赖 git clone，必然失败。
      # codeload.github.com 可达，故直接用 tarball 取源码。
      # 这里内联下载而非调用仓库脚本：避免「脚本自己要先从网络取回自己」的引导依赖。
      - name: 获取源码（tarball，替代 actions/checkout）
        run: |
          set -euo pipefail
          URL="https://codeload.github.com/17center/opsflow/tar.gz/${{ github.sha }}"
          rm -rf /tmp/opsflow-src /tmp/opsflow-src.tgz
          ok=0
          for M in "https://gh-proxy.com/" "https://ghproxy.net/" ""; do
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 300 -o /tmp/opsflow-src.tgz "${M}${URL}" 2>/dev/null \
               && gzip -t /tmp/opsflow-src.tgz 2>/dev/null; then
              echo "源码已下载（源: ${M:-direct}）"
              ok=1; break
            fi
            echo "源 ${M:-direct} 失败，尝试下一个"
          done
          [ "$ok" = "1" ] || { echo "::error::源码下载失败"; exit 1; }
          mkdir -p /tmp/opsflow-src
          tar -xzf /tmp/opsflow-src.tgz -C /tmp/opsflow-src --strip-components=1
          ls /tmp/opsflow-src/scripts/

      - name: 漂移检查：仓库脚本 vs 服务器已安装脚本
        working-directory: /tmp/opsflow-src
        run: |
          INSTALLED=/opt/opsflow/bin/deploy.sh
          if ! diff -q scripts/deploy.sh "$INSTALLED" >/dev/null 2>&1; then
            echo "::error::$INSTALLED 与仓库 scripts/deploy.sh 不一致。"
            echo "部署脚本以 root 安装、sudoers 仅放行该固定路径，仓库改动不会自动生效。"
            echo "请先在 136 上执行："
            echo "  sudo install -m 755 -o root -g root scripts/deploy.sh $INSTALLED"
            diff -u "$INSTALLED" scripts/deploy.sh || true
            exit 1
          fi
          echo "部署脚本一致 ✅"

      - name: 拉取构建产物（镜像加速 + sha256 强制校验）
        working-directory: /tmp/opsflow-src
        env:
          RUN_NUMBER: ${{ needs.build.outputs.run_number }}
          # 刻意不传 GH_TOKEN：仓库为 public，读取 release 无需鉴权。
          # 自托管 runner 上少一个令牌，就少一份泄露面。
        run: |
          chmod +x scripts/fetch-release.sh
          scripts/fetch-release.sh

      - name: 解包前端产物
        run: |
          mkdir -p /tmp/opsflow-release/dist
          tar -xzf /tmp/opsflow-release/frontend-dist.tar.gz -C /tmp/opsflow-release/dist
          rm -f /tmp/opsflow-release/frontend-dist.tar.gz
          ls /tmp/opsflow-release
          ls /tmp/opsflow-release/dist | head -5

      - name: 部署（含健康检查与失败自动回滚）
        run: |
          # deploy.sh 内部：备份 -> 原子替换 -> 重启 -> 健康检查 -> 失败自动回滚
          # 路径固定且以 root 安装，sudoers 仅放行这一条命令
          sudo -n /opt/opsflow/bin/deploy.sh

      - name: 清理暂存目录
        if: always()
        run: rm -rf /tmp/opsflow-release /tmp/opsflow-src /tmp/opsflow-src.tgz

  # ---------- 阶段三：清理 Release 产物 ----------
  # 单独成一个 job 在云端执行：136 上未安装 gh CLI，
  # 且不应为此在自托管 runner 上放置写权限令牌。
  cleanup:
    name: Cleanup release
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 删除本次 CI Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ci-${{ needs.build.outputs.run_number }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null \
            && echo "已删除 $TAG" || echo "$TAG 不存在或已删除"
