name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITEA_HOST: http://127.0.0.1:3000
      REPO: opsflow-admin/opsflow
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 "http://opsflow-admin:${{ github.token }}@127.0.0.1:3000/${REPO}.git" .
          git log --oneline -1

      - name: Build backend (Maven)
        run: |
          cd backend
          mvn -B clean package -DskipTests -q
          ls -lh target/*.jar

      - name: Build frontend (Vite)
        run: |
          cd frontend
          npm ci --no-audit --no-fund --loglevel=error
          npm run build
          ls dist | head -5

      - name: Deploy backend
        run: |
          cp backend/target/opsflow-backend-*.jar /opt/opsflow/backend/opsflow-backend.jar
          systemctl restart opsflow-backend
          echo "backend restarted"

      - name: Deploy frontend
        run: |
          rsync -a --delete frontend/dist/ /opt/opsflow/frontend/
          systemctl reload nginx
          echo "frontend deployed"

      - name: Health check
        run: |
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -X POST http://127.0.0.1/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}')
            if [ "$code" = "200" ]; then ok=1; echo "login OK after ${i} checks"; break; fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "HEALTH CHECK FAILED"; exit 1; }
          systemctl is-active opsflow-backend nginx